name: Fuzz APWorld
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: Eijebong/ap-actions/fuzz@main
        with:
          apworld-path: .
          apworld-name: pokemon_emerald_flit
          ap-version: 0.6.8
          python-version: '3.12'
          runs: 500
          yamls-per-run: 1
          dump-ignored: true # we'd like to know why yamls are being rejected
