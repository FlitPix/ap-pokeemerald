name: Bug Report
description: File a bug report.
labels: ["is: bug", "waiting on: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        Please note that this issue tracker is for *APWorld issues*. In-game bugs unrelated to logic and such should instead be reported on the [basepatch repo](https://github.com/FlitPix/pokeemerald).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: |
        Please describe what happened and include as many details as possible, even if they seem unrelated.
        
        This is where you can include things like tracker links. Do NOT post room links that aren't meant to be public!
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How did you get it to happen?
      description: Please provide detailed reproduction steps.
      value: |
        1. 
        2. 
        3. 
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: false
  - type: upload
    id: logs
    attributes:
      label: Please upload any relevant Archipelago log files.
      description: |
        You can find it in the `log` folder, in your Archipelago folder.

        If you have multiple relevant log files, please compress them into a zip file and send them that way.
    validations:
      required: false
